<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RenderIt</title>
  <style>
    :root {
      --bg: #12171d;
      --panel: #1a212b;
      --panel-2: #222d39;
      --accent: #4da3ff;
      --text: #edf3ff;
      --muted: #a8b3c5;
      --border: #2d3a49;
    }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .toolbar { display: flex; gap: 8px; padding: 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .primary { background: var(--accent); border-color: var(--accent); color: #06111d; font-weight: 700; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: block; color: var(--muted); margin-bottom: 6px; font-size: 12px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); }
    img { width: 100%; display: block; border-radius: 8px; border: 1px solid var(--border); background: #0d1117; }
    .small { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn primary" onclick="renderNow()">Render</button>
    <button class="btn" onclick="renderPreview()">Preview</button>
    <button class="btn" onclick="chooseEnv()">Choose HDRI</button>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label>Width</label>
        <input id="width" type="number" value="1280" />
      </div>
      <div>
        <label>Height</label>
        <input id="height" type="number" value="720" />
      </div>
    </div>
    <div class="grid" style="margin-top: 10px;">
      <div>
        <label>Samples</label>
        <select id="samples">
          <option value="1">Draft</option>
          <option value="4" selected>Preview</option>
          <option value="16">High</option>
          <option value="64">Final</option>
        </select>
      </div>
      <div>
        <label>Exposure</label>
        <input id="exposure" type="range" min="-5" max="5" step="0.1" value="0" />
      </div>
    </div>
    <div class="small" style="margin-top: 8px;" id="envLabel">Environment: none</div>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label>Sun Azimuth</label>
        <input id="az" type="number" value="135" />
      </div>
      <div>
        <label>Sun Elevation</label>
        <input id="el" type="number" value="45" />
      </div>
    </div>
  </div>

  <div class="card">
    <img id="preview" alt="Render preview" src="" />
  </div>

  <script>
    function renderNow() {
      const payload = JSON.stringify({
        width: Number(document.getElementById('width').value),
        height: Number(document.getElementById('height').value),
        samples: Number(document.getElementById('samples').value),
        exposure: Number(document.getElementById('exposure').value),
        az: Number(document.getElementById('az').value),
        el: Number(document.getElementById('el').value)
      });
      sketchup.render(payload);
    }

    function renderPreview() {
      renderNow();
    }

    function chooseEnv() {
      sketchup.choose_environment('');
    }

    function setEnvironment(path) {
      const label = document.getElementById('envLabel');
      label.textContent = path ? 'Environment: ' + path : 'Environment: none';
    }
  </script>
</body>
</html>
